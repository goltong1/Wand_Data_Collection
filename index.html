<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Wand Motion Dataset Recorder</title>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
      overflow-x: hidden;
      overflow-y: auto;
    }

    #app {
      width: 100vw;
      min-height: 100dvh;
      display: block;
    }

    header {
      padding: 10px 12px;
      background: #1b1b1b;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    header .title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    header .status {
      font-size: 13px;
      color: #ffd54a;
      text-align: right;
      padding-right: 112px;
    }

    .floating-upload {
      position: fixed;
      top: 52px;
      right: 10px;
      z-index: 9999;

      background: #6a1b9a;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 999px;

      padding: 10px 14px;
      min-height: 44px;
      font-size: 12px;
      font-weight: 800;

      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    .floating-upload:disabled {
      opacity: 0.45;
    }

    main {
      display: block;
      overflow: visible;
      padding-bottom: 24px;
    }

    .camera-wrap {
      position: relative;
      width: 100%;
      height: 32dvh;
      min-height: 160px;
      max-height: 360px;
      background: #000;
      touch-action: manipulation;
      overflow: hidden;
    }

    video,
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #video {
      transform: scaleX(-1);
    }

    #displayCanvas {
      z-index: 2;
    }

    #trajectoryCanvas {
      display: none;
    }

    .hud {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 3;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      pointer-events: none;
    }

    .hud-card {
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.45;
    }

    .swatch {
      width: 42px;
      height: 42px;
      border: 2px solid #fff;
      border-radius: 10px;
      background: rgb(120, 220, 60);
    }

    .controls {
      background: #181818;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 10px 6px;
      min-height: 42px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: #333;
      white-space: normal;
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background: #c62828;
    }

    button.save {
      background: #1b8f3a;
    }

    button.warn {
      background: #8f1b1b;
    }

    button.export {
      background: #1565c0;
    }

    button:disabled {
      opacity: 0.4;
    }

    .spell-panel {
      background: #111;
      border-top: 1px solid #333;
      padding: 10px 10px 24px;
      max-height: none;
      overflow: visible;
    }

    .spell-panel h2 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #ddd;
    }

    .spell-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .spell-btn {
      padding: 10px 4px;
      min-height: 40px;
      font-size: 11px;
      line-height: 1.15;
      background: #3a3a3a;
      word-break: break-word;
    }

    @media (min-width: 700px) {
      .camera-wrap {
        height: 50dvh;
      }

      .spell-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .controls {
        grid-template-columns: repeat(8, minmax(0, 1fr));
      }

      header .status {
        padding-right: 128px;
      }
    }

    .spell-btn.selected {
      background: #ffd54a;
      color: #111;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <button class="floating-upload" id="uploadAllBtn">UPLOAD ALL</button>

  <div id="app">
    <header>
      <div class="title">Wand Motion Recorder</div>
      <div class="status" id="statusText">카메라 준비 중...</div>
    </header>

    <main>
      <div class="camera-wrap" id="cameraWrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="displayCanvas"></canvas>
        <canvas id="trajectoryCanvas" width="640" height="480"></canvas>

        <div class="hud">
          <div class="hud-card">
            <div>Label: <b id="labelText">Expelliarmus</b></div>
            <div>Time: <span id="timeText">0.0 / 3.0s</span></div>
            <div>HSV Lower: <span id="lowerText">30,70,70</span></div>
            <div>HSV Upper: <span id="upperText">80,255,255</span></div>
          </div>
          <div class="swatch" id="swatch"></div>
        </div>
      </div>

      <div class="controls">
        <button id="cameraBtn">CAMERA</button>
        <button id="switchCameraBtn">FRONT</button>
        <button class="primary" id="recBtn">REC</button>
        <button id="clearBtn">CLEAR</button>
        <button class="save" id="saveBtn" disabled>SAVE</button>
        <button class="warn" id="discardBtn" disabled>DISCARD</button>
        <button class="export" id="exportBtn">EXPORT ZIP</button>
        <button class="warn" id="clearSavedBtn">CLEAR SAVED</button>
      </div>

      <section class="spell-panel">
        <h2>Spell Label</h2>
        <div class="spell-grid" id="spellGrid"></div>
      </section>
    </main>
  </div>

  <script>
    const SPELLS = [
      "Expelliarmus", "Lumos", "Protego", "Reducto", "Engorgio",
      "Expecto_Patronum", "Avada_Kedavra", "Incendio", "Wingardium_Leviosa", "Crucio",
      "MeloFores", "Imperio", "Salvio_Hexia", "Homorphus", "Arania_Exumai",
    ];

    const CAM_W = 640;
    const CAM_H = 480;
    const WAIT_DURATION = 1.0;
    const RECORD_DURATION = 3.0;
    const TARGET_FPS = 30;
    const SAMPLE_INTERVAL = 1.0 / TARGET_FPS;

    const H_TOL = 20;
    const S_TOL = 100;
    const V_TOL = 60;
    const MIN_AREA = 300;
    const MAX_V_FOR_COLOR = 240;

    const DB_NAME = "wand_motion_dataset_db";
    const DB_VERSION = 1;
    const STORE_NAME = "recordings";

    const SUPABASE_URL = "https://lutmcriwrmmcrjilrlqm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_PZ_pFOf8UG8Z_Vco4TiaVg_71uar0ej";
    const SUPABASE_BUCKET = "wand-dataset";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const video = document.getElementById("video");
    const cameraWrap = document.getElementById("cameraWrap");
    const displayCanvas = document.getElementById("displayCanvas");
    const displayCtx = displayCanvas.getContext("2d", { willReadFrequently: true });
    const trajectoryCanvas = document.getElementById("trajectoryCanvas");
    const trajectoryCtx = trajectoryCanvas.getContext("2d");

    const statusText = document.getElementById("statusText");
    const timeText = document.getElementById("timeText");
    const labelText = document.getElementById("labelText");
    const lowerText = document.getElementById("lowerText");
    const upperText = document.getElementById("upperText");
    const swatch = document.getElementById("swatch");

    const cameraBtn = document.getElementById("cameraBtn");
    const switchCameraBtn = document.getElementById("switchCameraBtn");
    const recBtn = document.getElementById("recBtn");
    const clearBtn = document.getElementById("clearBtn");
    const saveBtn = document.getElementById("saveBtn");
    const discardBtn = document.getElementById("discardBtn");
    const exportBtn = document.getElementById("exportBtn");
    const uploadAllBtn = document.getElementById("uploadAllBtn");
    const clearSavedBtn = document.getElementById("clearSavedBtn");
    const spellGrid = document.getElementById("spellGrid");

    let selectedSpell = SPELLS[0];
    let useFrontCamera = false;
    let currentStream = null;
    let state = "idle";
    let waitStart = 0;
    let recordStart = 0;
    let lastSampleTime = 0;
    let sampleFrameIndex = 0;

    let hsvLower = [30, 70, 70];
    let hsvUpper = [80, 255, 255];

    let prevPoint = null;
    let currentPoint = null;
    let trajectoryData = [];
    let pendingBlob = null;
    let pendingCsv = null;

    function initSpellButtons() {
      spellGrid.innerHTML = "";

      SPELLS.forEach((spell) => {
        const btn = document.createElement("button");
        btn.className = "spell-btn" + (spell === selectedSpell ? " selected" : "");
        btn.textContent = spell;

        btn.addEventListener("click", () => {
          if (state === "review") {
            setStatus("저장/폐기 후 라벨 변경 가능");
            return;
          }

          selectedSpell = spell;
          labelText.textContent = spell;
          initSpellButtons();
        });

        spellGrid.appendChild(btn);
      });
    }

    function setStatus(text) {
      statusText.textContent = text;
    }

    function resizeCanvasToDisplay() {
      const rect = cameraWrap.getBoundingClientRect();
      displayCanvas.width = Math.max(1, Math.floor(rect.width));
      displayCanvas.height = Math.max(1, Math.floor(rect.height));
    }

    function rgbToHsv(r, g, b) {
      r /= 255;
      g /= 255;
      b /= 255;

      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      const d = max - min;

      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const v = max;

      if (d !== 0) {
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;

        h *= 60;
        if (h < 0) h += 360;
      }

      return [
        Math.round(h / 2),
        Math.round(s * 255),
        Math.round(v * 255),
      ];
    }

    function hsvToRgb(h, s, v) {
      h *= 2;
      s /= 255;
      v /= 255;

      const c = v * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = v - c;

      let rp = 0;
      let gp = 0;
      let bp = 0;

      if (h < 60) [rp, gp, bp] = [c, x, 0];
      else if (h < 120) [rp, gp, bp] = [x, c, 0];
      else if (h < 180) [rp, gp, bp] = [0, c, x];
      else if (h < 240) [rp, gp, bp] = [0, x, c];
      else if (h < 300) [rp, gp, bp] = [x, 0, c];
      else [rp, gp, bp] = [c, 0, x];

      return [
        Math.round((rp + m) * 255),
        Math.round((gp + m) * 255),
        Math.round((bp + m) * 255),
      ];
    }

    function updateHsvUi() {
      lowerText.textContent = hsvLower.join(",");
      upperText.textContent = hsvUpper.join(",");

      const mid = [
        Math.round((hsvLower[0] + hsvUpper[0]) / 2),
        Math.round((hsvLower[1] + hsvUpper[1]) / 2),
        Math.round((hsvLower[2] + hsvUpper[2]) / 2),
      ];

      const [r, g, b] = hsvToRgb(mid[0], mid[1], mid[2]);
      swatch.style.background = `rgb(${r}, ${g}, ${b})`;
    }

    function clearRecording() {
      trajectoryCtx.clearRect(0, 0, CAM_W, CAM_H);

      trajectoryData = [];
      prevPoint = null;
      currentPoint = null;
      pendingBlob = null;
      pendingCsv = null;
      sampleFrameIndex = 0;
      lastSampleTime = 0;

      timeText.textContent = `0.0 / ${RECORD_DURATION.toFixed(1)}s`;

      saveBtn.disabled = true;
      discardBtn.disabled = true;

      if (state !== "waiting" && state !== "recording") {
        state = "idle";
      }

      updateSavedCountStatus("IDLE");
    }

    function startRecordingWait() {
      clearRecording();
      state = "waiting";
      waitStart = performance.now() / 1000;
      setStatus("1초 후 녹화 시작");
    }

    function enterReview() {
      state = "review";
      prevPoint = null;

      setStatus("REVIEW - 저장 또는 폐기 선택");
      timeText.textContent = `${RECORD_DURATION.toFixed(1)} / ${RECORD_DURATION.toFixed(1)}s`;

      saveBtn.disabled = false;
      discardBtn.disabled = false;

      trajectoryCanvas.toBlob((blob) => {
        pendingBlob = blob;
      }, "image/png");

      pendingCsv = makeCsv(trajectoryData);
    }

    function makeCsv(rows) {
      const header = "frame,timestamp,x,y,detected\n";
      return header + rows.map((r) => r.join(",")).join("\n");
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = filename;

      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);
    }

    function safePathName(name) {
      return String(name).replace(/[^a-zA-Z0-9_.-]/g, "_");
    }

    function getUploadBaseName(label) {
      const now = new Date();
      const timestamp = now.toISOString().replace(/[:.]/g, "-");
      const rand = Math.random().toString(36).slice(2, 8);
      const safeLabel = safePathName(label);

      return `${safeLabel}_${timestamp}_${rand}`;
    }

    function pickColorFromTouch(clientX, clientY) {
      if (state === "review") return;

      const rect = displayCanvas.getBoundingClientRect();
      const x = Math.floor((clientX - rect.left) * displayCanvas.width / rect.width);
      const y = Math.floor((clientY - rect.top) * displayCanvas.height / rect.height);

      if (x < 0 || y < 0 || x >= displayCanvas.width || y >= displayCanvas.height) return;

      const pixel = displayCtx.getImageData(x, y, 1, 1).data;
      const [h, s, v] = rgbToHsv(pixel[0], pixel[1], pixel[2]);

      const lowerH = Math.max(0, h - H_TOL);
      const upperH = Math.min(179, h + H_TOL);
      const lowerS = Math.max(30, s - S_TOL);
      const upperS = 255;
      const lowerV = Math.max(30, v - V_TOL);

      let upperV = Math.min(MAX_V_FOR_COLOR, v + V_TOL);
      if (upperV <= lowerV) upperV = Math.min(255, lowerV + 30);

      hsvLower = [lowerH, lowerS, lowerV];
      hsvUpper = [upperH, upperS, upperV];

      updateHsvUi();
      setStatus(`색상 선택 HSV(${h},${s},${v})`);
    }

    function getVideoSourceRect(videoW, videoH, canvasW, canvasH) {
      const videoRatio = videoW / videoH;
      const canvasRatio = canvasW / canvasH;

      let sx = 0;
      let sy = 0;
      let sw = videoW;
      let sh = videoH;

      if (videoRatio > canvasRatio) {
        sw = videoH * canvasRatio;
        sx = (videoW - sw) / 2;
      } else {
        sh = videoW / canvasRatio;
        sy = (videoH - sh) / 2;
      }

      return { sx, sy, sw, sh };
    }

    function detectPoint(imageData) {
      const data = imageData.data;
      const w = imageData.width;
      const h = imageData.height;

      let count = 0;
      let sumX = 0;
      let sumY = 0;

      const step = 2;

      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          const idx = (y * w + x) * 4;

          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];

          const [hh, ss, vv] = rgbToHsv(r, g, b);

          if (
            hh >= hsvLower[0] && hh <= hsvUpper[0] &&
            ss >= hsvLower[1] && ss <= hsvUpper[1] &&
            vv >= hsvLower[2] && vv <= hsvUpper[2]
          ) {
            count++;
            sumX += x;
            sumY += y;
          }
        }
      }

      if (count * step * step < MIN_AREA) return null;

      return {
        x: Math.round(sumX / count),
        y: Math.round(sumY / count),
        area: count * step * step,
      };
    }

    function drawTrajectoryPoint(point) {
      const sx = CAM_W / displayCanvas.width;
      const sy = CAM_H / displayCanvas.height;

      const tx = point.x * sx;
      const ty = point.y * sy;

      trajectoryCtx.strokeStyle = "white";
      trajectoryCtx.lineWidth = 5;
      trajectoryCtx.lineCap = "round";
      trajectoryCtx.lineJoin = "round";

      if (prevPoint) {
        const px = prevPoint.x * sx;
        const py = prevPoint.y * sy;

        trajectoryCtx.beginPath();
        trajectoryCtx.moveTo(px, py);
        trajectoryCtx.lineTo(tx, ty);
        trajectoryCtx.stroke();
      }

      prevPoint = point;
    }

    function openDatasetDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = (event) => {
          const db = event.target.result;

          if (!db.objectStoreNames.contains(STORE_NAME)) {
            const store = db.createObjectStore(STORE_NAME, {
              keyPath: "id",
              autoIncrement: true,
            });

            store.createIndex("label", "label", { unique: false });
            store.createIndex("baseName", "baseName", { unique: true });
            store.createIndex("createdAt", "createdAt", { unique: false });
          }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveRecordingToIndexedDb(record) {
      const db = await openDatasetDb();

      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);

        store.add(record);

        tx.oncomplete = () => {
          db.close();
          resolve();
        };

        tx.onerror = () => {
          db.close();
          reject(tx.error);
        };
      });
    }

    async function getAllRecordingsFromIndexedDb() {
      const db = await openDatasetDb();

      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const request = store.getAll();

        request.onsuccess = () => {
          db.close();
          resolve(request.result);
        };

        request.onerror = () => {
          db.close();
          reject(request.error);
        };
      });
    }

    async function clearIndexedDbRecordings() {
      const db = await openDatasetDb();

      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);

        store.clear();

        tx.oncomplete = () => {
          db.close();
          resolve();
        };

        tx.onerror = () => {
          db.close();
          reject(tx.error);
        };
      });
    }

    async function getSavedCount() {
      const db = await openDatasetDb();

      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const request = store.count();

        request.onsuccess = () => {
          db.close();
          resolve(request.result);
        };

        request.onerror = () => {
          db.close();
          reject(request.error);
        };
      });
    }

    async function updateSavedCountStatus(prefix = "IDLE") {
      try {
        const count = await getSavedCount();
        setStatus(`${prefix} / SAVED: ${count}`);
      } catch (err) {
        console.error(err);
        setStatus(prefix);
      }
    }

    async function saveRecording() {
      if (!pendingCsv) return;

      const base = getUploadBaseName(selectedSpell);

      try {
        setStatus("브라우저 내부 저장 중...");

        const record = {
          label: selectedSpell,
          baseName: base,
          createdAt: new Date().toISOString(),
          pngBlob: pendingBlob,
          csvText: pendingCsv,
          targetFps: TARGET_FPS,
          recordDuration: RECORD_DURATION,
          camWidth: CAM_W,
          camHeight: CAM_H,
          hsvLower: [...hsvLower],
          hsvUpper: [...hsvUpper],
        };

        await saveRecordingToIndexedDb(record);

        state = "finished";
        saveBtn.disabled = true;
        discardBtn.disabled = true;

        pendingBlob = null;
        pendingCsv = null;

        await updateSavedCountStatus(`저장 완료: ${base}`);
      } catch (err) {
        console.error(err);
        setStatus("브라우저 저장 실패");
        alert("브라우저 내부 저장에 실패했습니다.");
      }
    }

    function discardRecording() {
      pendingBlob = null;
      pendingCsv = null;

      state = "finished";

      saveBtn.disabled = true;
      discardBtn.disabled = true;

      updateSavedCountStatus("녹화 데이터 폐기");
    }

    async function exportAllRecordingsAsZip() {
      try {
        const records = await getAllRecordingsFromIndexedDb();

        if (!records.length) {
          alert("내보낼 저장 데이터가 없습니다.");
          setStatus("저장 데이터 없음");
          return;
        }

        if (typeof JSZip === "undefined") {
          alert("JSZip 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.");
          setStatus("ZIP 라이브러리 로드 실패");
          return;
        }

        setStatus(`ZIP 생성 중... ${records.length}개`);

        const zip = new JSZip();

        records.forEach((record) => {
          const label = record.label || "unknown";
          const baseName = record.baseName || `record_${record.id}`;
          const safeLabel = safePathName(label);

          const folder = zip.folder(safeLabel);

          if (record.pngBlob) {
            folder.file(`${baseName}.png`, record.pngBlob);
          }

          if (record.csvText) {
            folder.file(`${baseName}.csv`, record.csvText);
          }

          const meta = {
            id: record.id,
            label: record.label,
            baseName: record.baseName,
            createdAt: record.createdAt,
            targetFps: record.targetFps,
            recordDuration: record.recordDuration,
            camWidth: record.camWidth,
            camHeight: record.camHeight,
            hsvLower: record.hsvLower,
            hsvUpper: record.hsvUpper,
          };

          folder.file(`${baseName}.json`, JSON.stringify(meta, null, 2));
        });

        const zipBlob = await zip.generateAsync({
          type: "blob",
          compression: "DEFLATE",
          compressionOptions: {
            level: 6,
          },
        });

        const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
        downloadBlob(zipBlob, `wand_dataset_${timestamp}.zip`);

        setStatus(`ZIP 내보내기 완료: ${records.length}개`);
      } catch (err) {
        console.error(err);
        setStatus("ZIP 내보내기 실패");
        alert("ZIP 내보내기에 실패했습니다.");
      }
    }

    async function uploadAllRecordingsToSupabase() {
      try {
        const records = await getAllRecordingsFromIndexedDb();

        if (!records.length) {
          alert("업로드할 저장 데이터가 없습니다.");
          setStatus("업로드할 데이터 없음");
          return;
        }

        const ok = confirm(`${records.length}개 녹화 데이터를 Supabase로 업로드할까요?`);
        if (!ok) return;

        uploadAllBtn.disabled = true;
        exportBtn.disabled = true;
        clearSavedBtn.disabled = true;

        setStatus(`Supabase 업로드 시작... 0 / ${records.length}`);

        let successCount = 0;
        let failCount = 0;

        for (let i = 0; i < records.length; i++) {
          const record = records[i];

          const label = safePathName(record.label || "unknown");
          const baseName = safePathName(record.baseName || `record_${record.id}`);

          const pngPath = `${label}/${baseName}.png`;
          const csvPath = `${label}/${baseName}.csv`;

          setStatus(`업로드 중... ${i + 1} / ${records.length}`);

          try {
            if (record.pngBlob) {
              const { error: pngError } = await supabaseClient
                .storage
                .from(SUPABASE_BUCKET)
                .upload(pngPath, record.pngBlob, {
                  contentType: "image/png",
                  upsert: true,
                });

              if (pngError) throw pngError;
            }

            if (record.csvText) {
              const csvBlob = new Blob([record.csvText], {
                type: "text/csv;charset=utf-8",
              });

              const { error: csvError } = await supabaseClient
                .storage
                .from(SUPABASE_BUCKET)
                .upload(csvPath, csvBlob, {
                  contentType: "text/csv;charset=utf-8",
                  upsert: true,
                });

              if (csvError) throw csvError;
            }

            const { error: dbError } = await supabaseClient
              .from("recordings")
              .upsert({
                label: record.label,
                base_name: record.baseName,
                png_path: record.pngBlob ? pngPath : null,
                csv_path: record.csvText ? csvPath : null,
                local_created_at: record.createdAt,
                target_fps: record.targetFps,
                record_duration: record.recordDuration,
                cam_width: record.camWidth,
                cam_height: record.camHeight,
                hsv_lower: record.hsvLower || null,
                hsv_upper: record.hsvUpper || null,
              }, {
                onConflict: "base_name",
              });

            if (dbError) throw dbError;

            successCount++;
          } catch (err) {
            console.error("Upload failed:", record, err);
            failCount++;
          }
        }

        setStatus(`업로드 완료: 성공 ${successCount}, 실패 ${failCount}`);

        if (failCount > 0) {
          alert(`일부 업로드 실패\n성공: ${successCount}\n실패: ${failCount}\n브라우저 콘솔 로그를 확인하세요.`);
        } else {
          alert(`Supabase 업로드 완료: ${successCount}개`);
        }
      } catch (err) {
        console.error(err);
        setStatus("Supabase 업로드 실패");
        alert("Supabase 업로드 중 오류가 발생했습니다.");
      } finally {
        uploadAllBtn.disabled = false;
        exportBtn.disabled = false;
        clearSavedBtn.disabled = false;
      }
    }

    async function clearSavedDataset() {
      const ok = confirm("브라우저에 저장된 모든 녹화 데이터를 삭제할까요? 이 작업은 되돌릴 수 없습니다.");

      if (!ok) return;

      try {
        await clearIndexedDbRecordings();
        setStatus("저장 데이터 전체 삭제 완료");
      } catch (err) {
        console.error(err);
        setStatus("저장 데이터 삭제 실패");
        alert("저장 데이터 삭제에 실패했습니다.");
      }
    }

    function drawLoop() {
      requestAnimationFrame(drawLoop);

      if (!video.videoWidth || !video.videoHeight) return;

      const now = performance.now() / 1000;

      const { sx, sy, sw, sh } = getVideoSourceRect(
        video.videoWidth,
        video.videoHeight,
        displayCanvas.width,
        displayCanvas.height
      );

      displayCtx.save();
      displayCtx.clearRect(0, 0, displayCanvas.width, displayCanvas.height);
      displayCtx.translate(displayCanvas.width, 0);
      displayCtx.scale(-1, 1);
      displayCtx.drawImage(
        video,
        sx, sy, sw, sh,
        0, 0,
        displayCanvas.width,
        displayCanvas.height
      );
      displayCtx.restore();

      const frame = displayCtx.getImageData(0, 0, displayCanvas.width, displayCanvas.height);
      currentPoint = state === "review" ? null : detectPoint(frame);

      if (state === "waiting") {
        const remain = Math.max(0, WAIT_DURATION - (now - waitStart));
        setStatus(`START IN ${remain.toFixed(1)}s`);

        if (remain <= 0) {
          state = "recording";
          recordStart = now;
          lastSampleTime = now;
          sampleFrameIndex = 0;
          prevPoint = null;
          setStatus("RECORDING");
        }
      }

      if (state === "recording") {
        const elapsed = now - recordStart;

        timeText.textContent = `${Math.min(elapsed, RECORD_DURATION).toFixed(1)} / ${RECORD_DURATION.toFixed(1)}s`;

        if (currentPoint) {
          drawTrajectoryPoint(currentPoint);
        } else {
          prevPoint = null;
        }

        while (now - lastSampleTime >= SAMPLE_INTERVAL) {
          const ts = Number((sampleFrameIndex * SAMPLE_INTERVAL).toFixed(4));

          if (currentPoint) {
            const sx2 = CAM_W / displayCanvas.width;
            const sy2 = CAM_H / displayCanvas.height;

            trajectoryData.push([
              sampleFrameIndex,
              ts,
              Math.round(currentPoint.x * sx2),
              Math.round(currentPoint.y * sy2),
              1,
            ]);
          } else {
            trajectoryData.push([
              sampleFrameIndex,
              ts,
              "",
              "",
              0,
            ]);
          }

          sampleFrameIndex++;
          lastSampleTime += SAMPLE_INTERVAL;
        }

        if (elapsed >= RECORD_DURATION) {
          enterReview();
        }
      }

      if (currentPoint) {
        displayCtx.beginPath();
        displayCtx.arc(currentPoint.x, currentPoint.y, 10, 0, Math.PI * 2);
        displayCtx.lineWidth = 3;
        displayCtx.strokeStyle = "red";
        displayCtx.stroke();
      }

      displayCtx.globalAlpha = 0.9;
      displayCtx.drawImage(trajectoryCanvas, 0, 0, displayCanvas.width, displayCanvas.height);
      displayCtx.globalAlpha = 1.0;
    }

    function stopCurrentCamera() {
      if (!currentStream) return;

      currentStream.getTracks().forEach((track) => track.stop());
      currentStream = null;
      video.srcObject = null;
    }

    function getCameraCandidates() {
      const mode = useFrontCamera ? "user" : "environment";

      return [
        {
          video: {
            facingMode: { exact: mode },
            width: { ideal: 1280 },
            height: { ideal: 720 },
          },
          audio: false,
        },
        {
          video: {
            facingMode: mode,
            width: { ideal: 1280 },
            height: { ideal: 720 },
          },
          audio: false,
        },
        {
          video: true,
          audio: false,
        },
      ];
    }

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("이 브라우저는 카메라 API를 지원하지 않음");
        return;
      }

      const isSecure =
        location.protocol === "https:" ||
        location.hostname === "localhost" ||
        location.hostname === "127.0.0.1";

      if (!isSecure) {
        setStatus("카메라는 HTTPS 또는 localhost에서만 작동함");
        alert("모바일 브라우저 카메라는 HTTPS 환경에서 실행해야 합니다. file:// 또는 http://에서는 카메라가 안 뜰 수 있습니다.");
        return;
      }

      stopCurrentCamera();

      const cameraName = useFrontCamera ? "전면" : "후면";
      let lastError = null;

      for (const constraints of getCameraCandidates()) {
        try {
          setStatus(`${cameraName} 카메라 권한 요청 중...`);

          const stream = await navigator.mediaDevices.getUserMedia(constraints);

          currentStream = stream;
          video.srcObject = stream;
          video.muted = true;
          video.setAttribute("playsinline", "true");
          video.setAttribute("autoplay", "true");

          await new Promise((resolve) => {
            video.onloadedmetadata = () => resolve();
          });

          await video.play();

          resizeCanvasToDisplay();

          switchCameraBtn.textContent = useFrontCamera ? "BACK" : "FRONT";

          await updateSavedCountStatus(`IDLE - ${cameraName} 카메라 사용 중`);

          return;
        } catch (err) {
          console.error("Camera start failed:", err);
          lastError = err;
        }
      }

      const name = lastError?.name || "UnknownError";

      if (name === "NotAllowedError") {
        setStatus("카메라 권한이 거부됨");
        alert("브라우저 설정에서 카메라 권한을 허용해주세요.");
      } else if (name === "NotFoundError") {
        setStatus("사용 가능한 카메라를 찾지 못함");
      } else if (name === "NotReadableError") {
        setStatus("다른 앱이 카메라를 사용 중일 수 있음");
      } else {
        setStatus(`카메라 시작 실패: ${name}`);
      }
    }

    cameraBtn.addEventListener("click", async () => {
      await startCamera();
    });

    switchCameraBtn.addEventListener("click", async () => {
      if (state === "recording" || state === "waiting") {
        setStatus("녹화 중에는 카메라 전환 불가");
        return;
      }

      useFrontCamera = !useFrontCamera;
      switchCameraBtn.textContent = useFrontCamera ? "BACK" : "FRONT";

      await startCamera();
    });

    recBtn.addEventListener("click", () => {
      if (["idle", "finished"].includes(state)) {
        startRecordingWait();
      } else if (state === "review") {
        setStatus("먼저 저장 또는 폐기 선택");
      }
    });

    clearBtn.addEventListener("click", () => {
      clearRecording();
    });

    saveBtn.addEventListener("click", () => {
      saveRecording();
    });

    discardBtn.addEventListener("click", () => {
      discardRecording();
    });

    exportBtn.addEventListener("click", () => {
      exportAllRecordingsAsZip();
    });

    uploadAllBtn.addEventListener("click", () => {
      uploadAllRecordingsToSupabase();
    });

    clearSavedBtn.addEventListener("click", () => {
      clearSavedDataset();
    });

    cameraWrap.addEventListener("click", (e) => {
      pickColorFromTouch(e.clientX, e.clientY);
    });

    window.addEventListener("resize", resizeCanvasToDisplay);

    window.addEventListener("orientationchange", () => {
      setTimeout(resizeCanvasToDisplay, 300);
    });

    initSpellButtons();
    updateHsvUi();
    resizeCanvasToDisplay();
    updateSavedCountStatus("CAMERA 버튼을 눌러 카메라 시작");
    drawLoop();
  </script>
</body>
</html>
